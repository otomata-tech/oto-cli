name: CI

# oto-cli n'a pas de tests propres → smoke d'import/CLI : l'install résout (dont
# oto-core) et la commande `oto` se construit (Typer) sans casser. Catch les
# imports morts / entry-point cassé. Cf. otomata-private#39 (#5).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install .
      - name: Smoke (la CLI se construit)
        run: oto --help
