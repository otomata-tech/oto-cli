name: CI

# oto-cli reste une façade mince → pas de suite exhaustive, mais deux niveaux
# depuis oto-cli#11/oto-core#63 : smoke d'import/CLI (l'install résout, dont
# oto-core, et `oto` se construit sans casser — cf. otomata-private#39/#5), et
# des tests ciblés sur les commandes qui portent une vraie logique (secrets :
# imports lazy par sous-commande, jamais exercés par le smoke `--help` seul —
# c'est comme ça que oto.scaleway_secrets et _get_user_secrets sont restés
# cassés en silence après le split oto-core).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ".[dev]"
      - name: Smoke (la CLI se construit)
        run: oto --help
      - name: Tests
        run: pytest tests/ -v
