name: CLA

# Demande la signature du CLA sur toute PR d'un contributeur qui ne l'a pas
# encore signé. Le CLA vit dans otomata-tech/oto (CLA.md), les signatures dans
# le repo prive otomata-tech/cla-signatures.
#
# Pourquoi pull_request_target et non pull_request : les PR venant d'un fork
# n'ont pas acces aux secrets avec pull_request. L'action ne fait aucun checkout
# du code de la PR — elle ne lit que les metadonnees — donc pas d'execution de
# code non fiable avec les droits du repo de base.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Ne tourne que sur les PR et sur le commentaire de signature — pas sur
    # chaque commentaire d'issue du repo.
    if: >-
      github.event_name == 'pull_request_target' ||
      contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
    env:
      HAS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN != '' && 'true' || 'false' }}
    steps:
      - name: Token de signatures absent
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning title=CLA non applique::Le secret d'organisation CLA_SIGNATURES_TOKEN est absent — la signature du CLA n'est pas verifiee sur cette PR. Voir otomata-tech/oto/CONTRIBUTING.md."

      - name: Verifier la signature du CLA
        if: env.HAS_TOKEN == 'true'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/otomata-tech/oto/blob/main/CLA.md
          path-to-signatures: signatures/v1.json
          branch: main
          remote-organization-name: otomata-tech
          remote-repository-name: cla-signatures
          # Le titulaire des droits et les bots n'ont rien a signer.
          allowlist: AlexisLaporte,dependabot[bot],github-actions[bot],*[bot]
          custom-notsigned-prcomment: >-
            Merci pour cette pull request. Avant de pouvoir la merger, il faut
            que le CLA soit signe — c'est ce qui permet au projet de continuer a
            distribuer votre contribution. Vous gardez votre copyright.
            Lisez-le, puis repondez dans ce fil avec exactement la phrase
            ci-dessous.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: CLA signe — merci.
