name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, oto-platform]
    steps:
      - name: Deploy (build serveur via script root-restreint)
        # Runner self-hosted sur la box dédiée (user non-root `gha-runner`, sudo
        # NOPASSWD limité à /opt/deploy/oto-cli.sh) : plus de SSH entrant (port 22
        # filtré par CrowdSec, qui droppe les IP des runners GitHub hosted). Source
        # de vérité du déploiement : /opt/deploy/oto-cli.sh sur le serveur.
        run: sudo /opt/deploy/oto-cli.sh
