name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to oto-platform box
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 151.115.148.128
          username: root
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          # La clé SSH est RESTREINTE côté serveur : authorized_keys force
          # command="/opt/deploy/oto-cli.sh" (clé persistée dans instance_keys
          # immutable, cf. /opt/add-deploy-key.sh). sshd exécute TOUJOURS ce
          # script et ignore le `script:` ci-dessous — gardé pour lisibilité,
          # la source de vérité est /opt/deploy/oto-cli.sh sur le serveur.
          script: /opt/deploy/oto-cli.sh
