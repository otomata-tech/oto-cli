[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oto-cli"
version = "1.6.0"
description = "CLI façade for Oto — Typer commands over the oto-core connector library."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alexis Laporte" }]
keywords = ["cli", "ai-agents", "automation", "api", "llm"]
dependencies = [
    # `[stock]` (duckdb/pyarrow/pandas) EN BASE, pas en extra : la CLI est le
    # FALLBACK quand le MCP est indisponible, et `oto fr get` / `oto fr bilans`
    # lisent des parquets via duckdb (import lazy dans `france_opendata.inpi`).
    # En extra, l'échec survenait au pire moment — MCP à terre, CLI qui lève un
    # `ModuleNotFoundError: duckdb` brut, et un contournement manuel à trouver
    # (`pipx inject oto-cli duckdb`). Un fallback qui exige une install au moment
    # de la panne n'est pas un fallback (signal d'usage #294).
    "oto-core[stock]",
    "typer>=0.9.0",
]

[project.optional-dependencies]
# Les extras client-side vivent dans oto-core ; re-exportés pour `oto-cli[all]`.
# `stock` est conservé (no-op depuis qu'il est en base) : `oto-cli[stock]` reste
# une install valide pour qui l'a scripté.
google = ["oto-core[google]"]
browser = ["oto-core[browser]"]
vivatech = ["oto-core[vivatech]"]
anthropic = ["oto-core[anthropic]"]
stock = ["oto-core[stock]"]
all = ["oto-core[all]"]

[project.urls]
Repository = "https://github.com/otomata-tech/oto-cli"

[project.scripts]
oto = "oto.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oto", "oto.*"]
namespaces = true
